<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#22261f">
<title>Yard Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #22261f; --board: #262b23; --board-line: #3a4033;
    --chalk: #f0ece0; --chalk-dim: #9aa093;
    --green: #3f5c46; --green-bright: #5a8065; --red: #b6483c;
    --radius: 10px; --font-d: 'Kalam', cursive; --font-b: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--chalk); font-family: var(--font-b); min-height: 100vh; }
  .page { max-width: 480px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top,0px)) 16px 40px; display: flex; flex-direction: column; gap: 18px; }
  .title { font-family: var(--font-d); font-weight: 700; font-size: 32px; }
  .subtitle { font-size: 12px; color: var(--chalk-dim); letter-spacing: 1px; text-transform: uppercase; }
  .card { background: var(--board); border: 1px solid var(--board-line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-family: var(--font-d); font-size: 20px; font-weight: 700; }
  label { font-size: 13px; color: var(--chalk-dim); display: block; margin-bottom: 4px; }
  .field-input, select {
    width: 100%; background: var(--bg); border: 1px solid var(--board-line); border-radius: 8px;
    color: var(--chalk); font-family: var(--font-b); font-size: 15px; padding: 11px 12px; outline: none;
  }
  .field-input:focus, select:focus { border-color: var(--green-bright); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .btn { border: none; border-radius: 10px; font-family: var(--font-b); font-weight: 600; font-size: 15px; padding: 12px; cursor: pointer; }
  .btn.primary { background: var(--green); color: var(--chalk); }
  .btn.ghost { background: transparent; border: 1px solid var(--board-line); color: var(--chalk-dim); }
  .err { color: var(--red); font-size: 13px; min-height: 16px; }
  .ok { color: var(--green-bright); font-size: 13px; min-height: 16px; }
  .link-box { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--board-line); border-radius: 8px; padding: 10px 12px; font-size: 13px; word-break: break-all; }
  .link-box button { flex-shrink: 0; background: var(--green); color: var(--chalk); border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .expiry-banner { border-radius: var(--radius); padding: 12px 14px; font-size: 13px; line-height: 1.4; }
  .expiry-banner.ok { background: var(--board); border: 1px solid var(--board-line); color: var(--chalk-dim); }
  .expiry-banner.warn { background: #3a2f16; border: 1px solid #d9a441; color: #d9a441; }
  .expiry-banner.expired { background: #3a1f1a; border: 1px solid var(--red); color: #e08578; }
  #logged-out, #logged-in { display: none; flex-direction: column; gap: 18px; }
</style>
</head>
<body>
<div class="page">
  <div>
    <div class="title" id="page-title">Yard Admin</div>
    <div class="subtitle" id="page-subtitle">Loading…</div>
  </div>

  <div id="logged-out">
    <div class="card">
      <h2>Log in</h2>
      <div>
        <label for="login-password">Admin password</label>
        <input class="field-input" id="login-password" type="password" placeholder="••••••••">
      </div>
      <div class="err" id="login-err"></div>
      <button class="btn primary" onclick="login()">Log in</button>
    </div>
  </div>

  <div id="logged-in">
    <div class="expiry-banner" id="expiry-banner" style="display:none;"></div>

    <div class="card">
      <h2>Share this board</h2>
      <div class="link-box"><span id="board-link-text"></span><button onclick="copyBoardLink()">Copy</button></div>
    </div>

    <div class="card">
      <h2>QR code</h2>
      <p style="font-size:13px; color:var(--chalk-dim); margin:-4px 0 2px;">Print this and pin it up — anyone can scan it to jump straight to the board, no typing a link.</p>
      <div style="background:#fff; border-radius:10px; padding:14px; display:flex; justify-content:center;">
        <img id="qr-preview" src="" alt="QR code for this board" style="width:180px; height:180px;">
      </div>
      <div class="row">
        <button class="btn primary" onclick="openPrintQR()">Open printable page</button>
        <button class="btn ghost" onclick="downloadQR()">Download PNG</button>
      </div>
    </div>

    <div class="card">
      <h2>Yard settings</h2>
      <div>
        <label for="set-name">Yard name (shown on the board)</label>
        <input class="field-input" id="set-name" maxlength="80">
      </div>
      <div>
        <label for="set-arena">Arena name (e.g. "The School", "Sand Arena")</label>
        <input class="field-input" id="set-arena" maxlength="80">
      </div>
      <div class="row">
        <div>
          <label for="set-start">Booking window starts</label>
          <select id="set-start"></select>
        </div>
        <div>
          <label for="set-end">Booking window ends</label>
          <select id="set-end"></select>
        </div>
      </div>
      <div class="err" id="settings-err"></div>
      <div class="ok" id="settings-ok"></div>
      <button class="btn primary" onclick="saveSettings()">Save settings</button>
    </div>

    <div class="card">
      <h2>Change admin password</h2>
      <div>
        <label for="pw-current">Current password</label>
        <input class="field-input" id="pw-current" type="password">
      </div>
      <div>
        <label for="pw-new">New password (min 6 characters)</label>
        <input class="field-input" id="pw-new" type="password">
      </div>
      <div class="err" id="pw-err"></div>
      <div class="ok" id="pw-ok"></div>
      <button class="btn primary" onclick="changePassword()">Update password</button>
    </div>

    <button class="btn ghost" onclick="logout()">Log out</button>
  </div>
</div>

<script>
const YARD_SLUG = location.pathname.split('/').filter(Boolean)[1] || '';
const API = '/api/y/' + YARD_SLUG;

function hFor(h) { return (h % 24).toString().padStart(2,'0') + ':00' + (h===24?' (midnight)':''); }
function populateHourSelects() {
  const start = document.getElementById('set-start'), end = document.getElementById('set-end');
  for (let h = 0; h <= 23; h++) start.innerHTML += `<option value="${h}">${hFor(h)}</option>`;
  for (let h = 1; h <= 24; h++) end.innerHTML += `<option value="${h}">${hFor(h)}</option>`;
}

async function init() {
  populateHourSelects();
  // These don't depend on whether the yard is currently open for business —
  // both are computable from the slug alone, so set them up front.
  document.getElementById('board-link-text').textContent = location.origin + '/y/' + YARD_SLUG + '/';
  document.getElementById('qr-preview').src = API + '/qr';

  const cfgRes = await fetch(API + '/config');
  if (cfgRes.status === 404) {
    document.getElementById('page-title').textContent = 'Yard not found';
    document.getElementById('page-subtitle').textContent = 'Check the link.';
    return;
  }
  if (cfgRes.ok) {
    const cfg = await cfgRes.json();
    document.getElementById('page-title').textContent = cfg.name + ' — Admin';
    document.getElementById('page-subtitle').textContent = 'Yard Settings';
  } else {
    // 403 — board suspended (expired or deactivated). Admin login still
    // works below; the full reason and contact details show in a banner
    // once logged in, via renderExpiryBanner().
    document.getElementById('page-subtitle').textContent = 'Board currently unavailable — log in below for details';
  }

  const sess = await fetch(API + '/admin/session').then(r => r.json());
  if (sess.loggedIn) showLoggedIn(); else showLoggedOut();
}

function showLoggedOut() {
  document.getElementById('logged-out').style.display = 'flex';
  document.getElementById('logged-in').style.display = 'none';
}
async function showLoggedIn() {
  document.getElementById('logged-out').style.display = 'none';
  document.getElementById('logged-in').style.display = 'flex';
  const res = await fetch(API + '/admin/settings');
  if (!res.ok) {
    // Session cookie missing/expired between the session check and now —
    // bounce back to the login screen rather than rendering a form full of
    // undefined values (or, worse, a false "deactivated" banner, since an
    // error body has no `active` field and would read as falsy).
    showLoggedOut();
    return;
  }
  const s = await res.json();
  document.getElementById('set-name').value = s.name;
  document.getElementById('set-arena').value = s.arenaName;
  document.getElementById('set-start').value = s.slotStartHour;
  document.getElementById('set-end').value = s.slotEndHour;
  renderExpiryBanner(s);
}

function renderExpiryBanner(s) {
  const el = document.getElementById('expiry-banner');
  const contact = s.contact || 'us';

  if (!s.active) {
    el.className = 'expiry-banner expired';
    el.textContent = `This board has been deactivated. Contact ${contact} for more information.`;
    el.style.display = 'block';
    return;
  }
  if (!s.expiresAt) { el.style.display = 'none'; return; }

  const days = Math.round((new Date(s.expiresAt + 'T00:00:00') - new Date(new Date().toISOString().slice(0,10) + 'T00:00:00')) / 86400000);
  el.style.display = 'block';
  if (s.expired || days < 0) {
    el.className = 'expiry-banner expired';
    el.textContent = `Your subscription ended on ${s.expiresAt}. The board is offline until renewed — contact ${contact} to renew.`;
  } else if (days <= 14) {
    el.className = 'expiry-banner warn';
    el.textContent = `Your subscription expires in ${days} day${days === 1 ? '' : 's'} (${s.expiresAt}). Contact ${contact} to renew and avoid interruption.`;
  } else {
    el.className = 'expiry-banner ok';
    el.textContent = `Subscription active until ${s.expiresAt}.`;
  }
}

async function login() {
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  const res = await fetch(API + '/admin/login', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password })
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Could not log in'; return; }
  showLoggedIn();
}

async function logout() {
  await fetch(API + '/admin/logout', { method: 'POST' });
  document.getElementById('login-password').value = '';
  showLoggedOut();
}

async function saveSettings() {
  const errEl = document.getElementById('settings-err'), okEl = document.getElementById('settings-ok');
  errEl.textContent = ''; okEl.textContent = '';
  const body = {
    name: document.getElementById('set-name').value,
    arenaName: document.getElementById('set-arena').value,
    slotStartHour: document.getElementById('set-start').value,
    slotEndHour: document.getElementById('set-end').value,
  };
  const res = await fetch(API + '/admin/settings', {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Could not save'; return; }
  okEl.textContent = 'Saved ✓';
  document.getElementById('page-title').textContent = data.name + ' — Admin';
}

async function changePassword() {
  const errEl = document.getElementById('pw-err'), okEl = document.getElementById('pw-ok');
  errEl.textContent = ''; okEl.textContent = '';
  const currentPassword = document.getElementById('pw-current').value;
  const newPassword = document.getElementById('pw-new').value;
  const res = await fetch(API + '/admin/change-password', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ currentPassword, newPassword })
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Could not update password'; return; }
  okEl.textContent = 'Password updated ✓';
  document.getElementById('pw-current').value = '';
  document.getElementById('pw-new').value = '';
}

function copyBoardLink() {
  navigator.clipboard.writeText(location.origin + '/y/' + YARD_SLUG).then(() => {
    const btn = event.target; const old = btn.textContent; btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = old, 1500);
  });
}

function openPrintQR() {
  window.open('/y/' + YARD_SLUG + '/qr-print', '_blank');
}

function downloadQR() {
  const a = document.createElement('a');
  a.href = API + '/qr?format=png';
  a.download = YARD_SLUG + '-qr.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

init();
</script>
</body>
</html>
