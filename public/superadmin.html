<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#22261f">
<title>Superadmin — School Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #22261f; --board: #262b23; --board-line: #3a4033;
    --chalk: #f0ece0; --chalk-dim: #9aa093;
    --green: #3f5c46; --green-bright: #5a8065; --red: #b6483c; --rust-bright: #c26840;
    --radius: 10px; --font-d: 'Kalam', cursive; --font-b: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--chalk); font-family: var(--font-b); min-height: 100vh; }
  .page { max-width: 640px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top,0px)) 16px 40px; display: flex; flex-direction: column; gap: 18px; }
  .title { font-family: var(--font-d); font-weight: 700; font-size: 32px; }
  .subtitle { font-size: 12px; color: var(--chalk-dim); letter-spacing: 1px; text-transform: uppercase; }
  .card { background: var(--board); border: 1px solid var(--board-line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-family: var(--font-d); font-size: 20px; font-weight: 700; }
  label { font-size: 13px; color: var(--chalk-dim); display: block; margin-bottom: 4px; }
  .field-input { width: 100%; background: var(--bg); border: 1px solid var(--board-line); border-radius: 8px; color: var(--chalk); font-family: var(--font-b); font-size: 15px; padding: 11px 12px; outline: none; }
  .field-input:focus { border-color: var(--green-bright); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .btn { border: none; border-radius: 10px; font-family: var(--font-b); font-weight: 600; font-size: 14px; padding: 11px; cursor: pointer; }
  .btn.primary { background: var(--green); color: var(--chalk); }
  .btn.ghost { background: transparent; border: 1px solid var(--board-line); color: var(--chalk-dim); }
  .btn.small { padding: 7px 10px; font-size: 12px; }
  .err { color: var(--red); font-size: 13px; min-height: 16px; }
  .ok { color: var(--green-bright); font-size: 13px; min-height: 16px; }
  #logged-out, #logged-in { display: none; flex-direction: column; gap: 18px; }
  .yard-row { border: 1px solid var(--board-line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .yard-row.inactive { opacity: .5; }
  .yard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .yard-name { font-family: var(--font-d); font-weight: 700; font-size: 18px; }
  .yard-meta { font-size: 12px; color: var(--chalk-dim); }
  .yard-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .yard-links a { color: var(--green-bright); font-size: 12px; text-decoration: none; border: 1px solid var(--board-line); border-radius: 6px; padding: 5px 9px; }
  .yard-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 10px; letter-spacing: .5px; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; }
  .badge.active { color: var(--green-bright); border: 1px solid var(--green); }
  .badge.inactive { color: var(--rust-bright); border: 1px solid var(--rust-bright); }
  .badge.warn { color: #d9a441; border: 1px solid #d9a441; }
  .expiry-line { font-size: 12px; }
  .expiry-line.ok { color: var(--chalk-dim); }
  .expiry-line.warn { color: #d9a441; }
  .expiry-line.expired { color: var(--rust-bright); }
  .expiry-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .expiry-row input[type=date] { width: auto; padding: 6px 8px; font-size: 12px; }
  .quickset-row { display: flex; gap: 8px; margin-top: 8px; }
  .quickset-row .btn { flex: 1; }
  .pw-reveal { background: var(--bg); border: 1px solid var(--green-bright); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  #yards-list { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<div class="page">
  <div>
    <div class="title">School Booking</div>
    <div class="subtitle">Superadmin</div>
  </div>

  <div id="logged-out">
    <div class="card">
      <h2>Log in</h2>
      <div>
        <label for="login-password">Superadmin password</label>
        <input class="field-input" id="login-password" type="password" placeholder="••••••••">
      </div>
      <div class="err" id="login-err"></div>
      <button class="btn primary" onclick="login()">Log in</button>
    </div>
  </div>

  <div id="logged-in">
    <div class="card">
      <h2>Add a yard</h2>
      <div>
        <label for="new-name">Yard name</label>
        <input class="field-input" id="new-name" maxlength="80" placeholder="e.g. Oakfield Livery">
      </div>
      <div>
        <label for="new-arena">Arena name (optional — defaults to "The School")</label>
        <input class="field-input" id="new-arena" maxlength="80" placeholder="The School">
      </div>
      <div>
        <label for="new-slug">URL slug (optional — auto-generated from the name)</label>
        <input class="field-input" id="new-slug" maxlength="40" placeholder="oakfield-livery">
      </div>
      <div>
        <label for="new-password">Admin password for this yard (min 6 characters)</label>
        <input class="field-input" id="new-password" placeholder="Give this to the yard's admin">
      </div>
      <div>
        <label for="new-expires">Paid until (optional — leave blank for no expiry)</label>
        <input class="field-input" id="new-expires" type="date">
        <div class="quickset-row">
          <button type="button" class="btn small ghost" onclick="quickSetDate('new-expires', 1)">1 month trial</button>
          <button type="button" class="btn small ghost" onclick="quickSetDate('new-expires', 12)">1 year</button>
          <button type="button" class="btn small ghost" onclick="document.getElementById('new-expires').value=''">No expiry</button>
        </div>
      </div>
      <div class="err" id="new-err"></div>
      <div class="ok" id="new-ok"></div>
      <button class="btn primary" onclick="createYard()">Create yard</button>
    </div>

    <div class="card">
      <h2>Yards</h2>
      <div id="yards-list"></div>
    </div>

    <button class="btn ghost" onclick="logout()">Log out</button>
  </div>
</div>

<script>
async function init() {
  const sess = await fetch('/api/superadmin/session').then(r => r.json());
  if (sess.loggedIn) showLoggedIn(); else showLoggedOut();
}

function showLoggedOut() {
  document.getElementById('logged-out').style.display = 'flex';
  document.getElementById('logged-in').style.display = 'none';
}
function showLoggedIn() {
  document.getElementById('logged-out').style.display = 'none';
  document.getElementById('logged-in').style.display = 'flex';
  loadYards();
}

async function login() {
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  const res = await fetch('/api/superadmin/login', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password })
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Could not log in'; return; }
  showLoggedIn();
}

async function logout() {
  await fetch('/api/superadmin/logout', { method: 'POST' });
  document.getElementById('login-password').value = '';
  showLoggedOut();
}

async function createYard() {
  const errEl = document.getElementById('new-err'), okEl = document.getElementById('new-ok');
  errEl.textContent = ''; okEl.textContent = '';
  const body = {
    name: document.getElementById('new-name').value,
    arenaName: document.getElementById('new-arena').value,
    slug: document.getElementById('new-slug').value,
    adminPassword: document.getElementById('new-password').value,
    expiresAt: document.getElementById('new-expires').value || null,
  };
  const res = await fetch('/api/superadmin/yards', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Could not create yard'; return; }
  okEl.textContent = `Created — board at ${location.origin}${data.boardUrl}`;
  document.getElementById('new-name').value = '';
  document.getElementById('new-arena').value = '';
  document.getElementById('new-slug').value = '';
  document.getElementById('new-password').value = '';
  document.getElementById('new-expires').value = '';
  loadYards();
}

// Sets a date input to today + N months — used by both the create form and
// the per-yard quick-extend buttons.
function quickSetDate(inputId, months) {
  const d = new Date();
  d.setMonth(d.getMonth() + months);
  document.getElementById(inputId).value = d.toISOString().slice(0, 10);
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function daysUntil(dateStr) {
  const ms = new Date(dateStr + 'T00:00:00') - new Date(new Date().toISOString().slice(0,10) + 'T00:00:00');
  return Math.round(ms / 86400000);
}

async function loadYards() {
  const yards = await fetch('/api/superadmin/yards').then(r => r.json());
  const el = document.getElementById('yards-list');
  el.innerHTML = '';
  if (!yards.length) { el.innerHTML = '<div class="yard-meta">No yards yet — add one above.</div>'; return; }
  yards.forEach(y => {
    const offline = !y.active || y.expired;
    const row = document.createElement('div');
    row.className = 'yard-row' + (offline ? ' inactive' : '');

    let badge;
    if (!y.active) badge = { text: 'Inactive', cls: 'inactive' };
    else if (y.expired) badge = { text: 'Expired', cls: 'inactive' };
    else if (y.expiresAt && daysUntil(y.expiresAt) <= 7) badge = { text: 'Expires soon', cls: 'warn' };
    else badge = { text: 'Active', cls: 'active' };

    let expiryLine, expiryCls;
    if (!y.expiresAt) { expiryLine = 'No expiry set'; expiryCls = 'ok'; }
    else if (y.expired) { expiryLine = `Expired ${escapeHtml(y.expiresAt)} — board is offline until extended`; expiryCls = 'expired'; }
    else if (daysUntil(y.expiresAt) <= 7) { expiryLine = `Paid until ${escapeHtml(y.expiresAt)} — expires in ${daysUntil(y.expiresAt)} day${daysUntil(y.expiresAt)===1?'':'s'}`; expiryCls = 'warn'; }
    else { expiryLine = `Paid until ${escapeHtml(y.expiresAt)}`; expiryCls = 'ok'; }

    row.innerHTML = `
      <div class="yard-head">
        <span class="yard-name">${escapeHtml(y.name)}</span>
        <span class="badge ${badge.cls}">${badge.text}</span>
      </div>
      <div class="yard-meta">${escapeHtml(y.arenaName)} · ${y.slotStartHour.toString().padStart(2,'0')}:00–${(y.slotEndHour%24).toString().padStart(2,'0')}:00 · ${y.upcomingBookings} upcoming booking${y.upcomingBookings===1?'':'s'}</div>
      <div class="expiry-line ${expiryCls}">${expiryLine}</div>
      <div class="yard-links">
        <a href="/y/${y.slug}/" target="_blank">View board</a>
        <a href="/y/${y.slug}/admin" target="_blank">Yard admin</a>
      </div>
      <div class="expiry-row">
        <input type="date" id="expiry-input-${y.id}" class="field-input" value="${y.expiresAt || ''}">
        <button class="btn small ghost" onclick="setExpiry(${y.id})">Set</button>
        <button class="btn small ghost" onclick="quickExtend(${y.id}, 1, '${y.expiresAt || ''}')">+1 month</button>
        <button class="btn small ghost" onclick="quickExtend(${y.id}, 12, '${y.expiresAt || ''}')">+1 year</button>
        ${y.expiresAt ? `<button class="btn small ghost" onclick="clearExpiry(${y.id})">Clear (no expiry)</button>` : ''}
      </div>
      <div class="yard-actions">
        <button class="btn small ghost" onclick="toggleActive(${y.id}, ${!y.active})">${y.active ? 'Deactivate' : 'Reactivate'}</button>
        <button class="btn small ghost" onclick="resetPassword(${y.id})">Reset admin password</button>
        <button class="btn small ghost" onclick="toggleQR('${y.slug}', this)">Show QR</button>
      </div>
      <div class="pw-reveal" id="pw-reveal-${y.id}" style="display:none;"></div>
      <div class="qr-reveal" id="qr-reveal-${y.slug}" style="display:none; flex-direction:column; align-items:center; gap:10px; background:#fff; border-radius:10px; padding:14px;">
        <img src="/api/y/${y.slug}/qr" alt="QR code for ${escapeHtml(y.name)}" style="width:160px; height:160px;">
        <div style="display:flex; gap:8px;">
          <a class="btn small primary" style="text-decoration:none; display:inline-block;" href="/y/${y.slug}/qr-print" target="_blank">Open printable page</a>
        </div>
      </div>
    `;
    el.appendChild(row);
  });
}

async function setExpiry(id) {
  const val = document.getElementById('expiry-input-' + id).value;
  await fetch('/api/superadmin/yards/' + id, {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ expiresAt: val || null })
  });
  loadYards();
}

// Extends from whichever is later: the yard's current expiry, or today.
// This matters for renewals — if a yard is already paid up to next March
// and you click "+1 year" today, you want it to land next-March-plus-a-year,
// not today-plus-a-year (which could actually shorten their remaining time).
async function quickExtend(id, months, currentExpiresAt) {
  const todayIso = new Date().toISOString().slice(0, 10);
  const base = (currentExpiresAt && currentExpiresAt > todayIso) ? new Date(currentExpiresAt + 'T00:00:00') : new Date();
  base.setMonth(base.getMonth() + months);
  const iso = base.toISOString().slice(0, 10);
  await fetch('/api/superadmin/yards/' + id, {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ expiresAt: iso })
  });
  loadYards();
}

async function clearExpiry(id) {
  await fetch('/api/superadmin/yards/' + id, {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ expiresAt: null })
  });
  loadYards();
}

async function toggleActive(id, active) {
  await fetch('/api/superadmin/yards/' + id, {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ active })
  });
  loadYards();
}

async function resetPassword(id) {
  const res = await fetch('/api/superadmin/yards/' + id + '/reset-admin-password', { method: 'POST' });
  const data = await res.json();
  if (!res.ok) return;
  const box = document.getElementById('pw-reveal-' + id);
  box.style.display = 'block';
  box.textContent = 'New admin password: ' + data.newPassword + ' (give this to the yard — it won\u2019t be shown again)';
}

function toggleQR(slug, btn) {
  const box = document.getElementById('qr-reveal-' + slug);
  const showing = box.style.display !== 'none';
  box.style.display = showing ? 'none' : 'flex';
  if (btn) btn.textContent = showing ? 'Show QR' : 'Hide QR';
}

init();
</script>
</body>
</html>
